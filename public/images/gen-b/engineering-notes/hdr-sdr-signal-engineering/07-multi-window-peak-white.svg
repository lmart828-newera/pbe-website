<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img">
  <rect width="1600" height="900" fill="#07111f"/>
  <rect x="1.5" y="1.5" width="1597" height="897" fill="none" stroke="#00cfff" stroke-opacity="0.28" stroke-width="2"/>
  <rect x="48" y="32" width="42" height="3" rx="1.5" fill="#00cfff"/>
  <text x="48" y="66" fill="#9aabc0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" letter-spacing="2.2">GEN-B · FIGURE 07</text>
  <text x="48" y="106" fill="#ffffff" font-family="ui-sans-serif, system-ui, sans-serif" font-size="32" font-weight="800">Multi-window PQ, exact artwork bounds</text>
  <text x="48" y="142" fill="#d5dce8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="17">Scale 0.42. Background code 64. Every window is neutral code 723, the narrow code for 1,000 cd/m².</text>

  <g transform="translate(48 176) scale(0.42)">
    <rect x="0" y="0" width="1920" height="1080" fill="#02060d" stroke="#ffffff" stroke-width="4"/>
    <rect x="288" y="238" width="64" height="64" fill="#d7e7f2"/>
    <rect x="896" y="206" width="128" height="128" fill="#d7e7f2"/>
    <rect x="1472" y="142" width="256" height="256" fill="#d7e7f2"/>
    <rect x="128" y="618" width="384" height="384" fill="#d7e7f2"/>
    <rect x="704" y="554" width="512" height="512" fill="#d7e7f2"/>
    <rect x="1288" y="548" width="624" height="524" fill="#d7e7f2"/>
    <g fill="#041018" font-family="ui-sans-serif, system-ui, sans-serif" font-size="42" font-weight="800">
      <text x="300" y="278">1</text>
      <text x="940" y="280">2</text>
      <text x="1570" y="280">3</text>
      <text x="290" y="830">4</text>
      <text x="930" y="830">5</text>
      <text x="1560" y="830">6</text>
    </g>
  </g>

  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" fill="#d5dce8">
    <text x="900" y="220" fill="#ffffff" font-size="22" font-weight="800">Window bounds and area</text>
    <text x="900" y="268">1   64×64 at (288, 238)     4,096 px</text>
    <text x="900" y="308">2   128×128 at (896, 206)   16,384 px</text>
    <text x="900" y="348">3   256×256 at (1472, 142)  65,536 px</text>
    <text x="900" y="388">4   384×384 at (128, 618)  147,456 px</text>
    <text x="900" y="428">5   512×512 at (704, 554)  262,144 px</text>
    <text x="900" y="468">6   624×524 at (1288, 548) 326,976 px</text>
    <text x="900" y="528" fill="#ffffff" font-weight="700">Covered pixels: 822,592</text>
    <text x="900" y="580">The six rectangles do not overlap.</text>
    <text x="900" y="616">The frame loop does not evaluate PQ.</text>
    <text x="900" y="652">It writes code 723 or code 64.</text>
    <text x="900" y="720" fill="#9aabc0">723 is the neutral 1,000 cd/m² code.</text>
    <text x="900" y="756" fill="#9aabc0">A non-neutral 723, such as</text>
    <text x="900" y="792" fill="#9aabc0">(723, 64, 64), is not that luminance.</text>
    <text x="900" y="848" fill="#9aabc0" font-size="16">This six-window layout is GEN-B geometry, not a BT.2111 figure.</text>
  </g>
</svg>
